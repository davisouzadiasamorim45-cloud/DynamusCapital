# VERSÃO DE DEMONSTRAÇÃO (planos gratuitos do Render). NÃO usar em produção.
# Limites do plano gratuito:
#   - a API desliga após 15 min sem acesso e leva ~1 min para voltar (o formulário fica travado na 1ª requisição);
#   - o banco expira 30 dias após a criação (+14 dias de carência, depois é apagado).
# Para produção use o render.yaml da branch main (planos pagos).

databases:
  - name: dynamus-db
    databaseName: dynamus_capital
    user: dynamus
    region: virginia
    plan: free
    # Lista vazia = só a API (rede interna do Render) acessa o banco.
    ipAllowList: []

services:
  - type: web
    name: dynamus-api
    runtime: python
    region: virginia
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && prisma generate --schema=prisma/schema.prisma
    # O plano gratuito não tem preDeployCommand nem Shell. Por isso, a cada subida:
    #   1. cria/atualiza as tabelas (sem --accept-data-loss);
    #   2. cria o admin a partir das variáveis SEED_* (se já existir, só avisa e segue);
    #   3. inicia a API.
    startCommand: prisma db push --schema=prisma/schema.prisma --skip-generate && (python -m app.seed || true) && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: dynamus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Para demo local use http://localhost:3000. Vários domínios: separe por vírgula.
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: admin@dynamuscapital.com.br
      - key: SEED_ADMIN_NOME
        value: Administrador
      # Senha do admin de demonstração (o Render pede o valor ao criar o Blueprint).
      - key: SEED_ADMIN_PASSWORD
        sync: false
