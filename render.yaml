# Blueprint do Render: Postgres + API FastAPI (ver "Deploy no Render" no README).
# O front (Next.js) não está aqui; ele aponta para esta API via NEXT_PUBLIC_API_URL.

databases:
  - name: dynamus-db
    databaseName: dynamus_capital
    user: dynamus
    region: virginia
    # Confira o nome do plano no painel do Render (planos de banco são renomeados de tempos em tempos).
    plan: basic-256mb
    # Lista vazia = só a API (rede interna do Render) acessa o banco; nada exposto à internet.
    ipAllowList: []

services:
  - type: web
    name: dynamus-api
    runtime: python
    region: virginia
    # Starter fica sempre ligado. O plano free desliga após 15 min sem acesso e o
    # formulário ficaria ~1 min travado na primeira requisição.
    plan: starter
    rootDir: backend
    # prisma py fetch baixa o query engine para PRISMA_BINARY_CACHE_DIR (dentro do repo,
    # que é o único diretório que sobrevive do build para o runtime no Render).
    buildCommand: pip install -r requirements.txt && prisma py fetch && prisma generate --schema=prisma/schema.prisma
    # Cria/atualiza as tabelas a cada deploy. Sem --accept-data-loss: mudanças destrutivas falham em vez de apagar dados.
    preDeployCommand: prisma db push --schema=prisma/schema.prisma --skip-generate
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Sem isto o engine vai para /opt/render/.cache, que o runtime não enxerga
      # (BinaryNotFoundError no startup).
      - key: PRISMA_BINARY_CACHE_DIR
        value: /opt/render/project/src/backend/.prisma-binaries
      - key: DATABASE_URL
        fromDatabase:
          name: dynamus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Domínio(s) do site, separados por vírgula. Ex.: https://www.dynamuscapital.com.br
      - key: CORS_ORIGINS
        sync: false
      # Provedores de CPF e placa: adicione CPF_LOOKUP_URL/CPF_LOOKUP_API_KEY e
      # PLACA_LOOKUP_URL/PLACA_LOOKUP_API_KEY no painel quando o cliente contratar.
